<svg viewBox="0 0 1400 950" xmlns="http://www.w3.org/2000/svg" font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif">

  <rect x="0" y="0" width="1400" height="950" fill="#ffffff"/>

  <!-- ============ TITLE BANNER ============ -->
  <rect x="0" y="0" width="1400" height="110" fill="#4E2A84"/>
  <text x="700" y="50" text-anchor="middle" fill="#ffffff" font-size="34" font-weight="700">
    Design of New Materials for Chemical Problems
  </text>
  <text x="700" y="85" text-anchor="middle" fill="#d7c7ff" font-size="19" font-style="italic">
    Through an Integrated ML + AI Approach
  </text>

  <!-- ============ LEFT PANEL: THE MODEL ============ -->
  <rect x="30" y="135" width="790" height="600" rx="10" fill="#ffffff" stroke="#2f8f8f" stroke-width="3"/>
  <text x="55" y="172" fill="#1a1a1a" font-size="24" font-weight="700">The Model</text>

  <!-- Row 1: Chemical Space -> Molecular Space -> ML + AI -->
  <rect x="60" y="200" width="170" height="60" rx="8" fill="#4E2A84"/>
  <text x="145" y="235" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">CHEMICAL SPACE</text>

  <path d="M 230 230 L 275 230" stroke="#5FA05F" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="252" y="218" text-anchor="middle" fill="#4E2A84" font-size="11">CoCo graph</text>

  <rect x="280" y="200" width="180" height="60" rx="8" fill="#4E2A84"/>
  <text x="370" y="235" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">MOLECULAR SPACE</text>

  <path d="M 460 230 L 505 230" stroke="#5FA05F" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <rect x="510" y="200" width="150" height="60" rx="8" fill="#4E2A84"/>
  <text x="585" y="235" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">ML + AI</text>

  <!-- descriptor note -->
  <text x="370" y="285" text-anchor="middle" fill="#555555" font-size="12">
    Descriptors: rule-based &#183; GNNs &#183; diffusion &#183; generative models
  </text>

  <!-- down arrow ML+AI -> Predict properties -->
  <path d="M 585 260 L 585 305" stroke="#5FA05F" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <rect x="480" y="310" width="220" height="65" rx="8" fill="#4E2A84"/>
  <text x="590" y="337" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">PREDICT PROPERTIES</text>
  <text x="590" y="358" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">OF INTEREST</text>

  <path d="M 480 342 L 300 342" stroke="#5FA05F" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="390" y="330" text-anchor="middle" fill="#4E2A84" font-size="11">screening</text>

  <rect x="100" y="310" width="200" height="65" rx="8" fill="#4E2A84"/>
  <text x="200" y="348" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">NEW COMPOUNDS</text>

  <path d="M 200 375 L 200 415" stroke="#5FA05F" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <rect x="80" y="420" width="240" height="65" rx="8" fill="#4E2A84"/>
  <text x="200" y="447" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">VALIDATE SYNTHETIC</text>
  <text x="200" y="466" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">EXISTENCE</text>

  <path d="M 320 452 L 365 452" stroke="#8a6bc9" stroke-width="4" marker-end="url(#arrowPurple)"/>

  <rect x="370" y="420" width="240" height="65" rx="8" fill="#4E2A84"/>
  <text x="490" y="447" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">EXPERIMENTAL DATA</text>
  <text x="490" y="466" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">BANK</text>

  <!-- feedback loop back up to ML+AI -->
  <path d="M 610 452 C 700 452, 730 300, 660 230" stroke="#8a6bc9" stroke-width="5" fill="none" stroke-dasharray="2 6" marker-end="url(#arrowPurpleSmall)"/>
  <text x="735" y="360" fill="#4E2A84" font-size="12" font-style="italic" transform="rotate(90 735 360)">retrain the model</text>

  <text x="490" y="500" text-anchor="middle" fill="#555555" font-size="12">
    published + unpublished results, curated via an LLM
  </text>

  <!-- ============ RIGHT PANEL: KEY CHALLENGES ============ -->
  <rect x="850" y="135" width="520" height="600" rx="14" fill="#f4f2fa" stroke="#8a6bc9" stroke-width="2"/>
  <text x="880" y="180" fill="#1a1a1a" font-size="24" font-weight="700">Key Challenges</text>

  <circle cx="885" cy="225" r="6" fill="#4E2A84"/>
  <text x="905" y="215" fill="#333333" font-size="15" font-weight="600">A vast chemical space</text>
  <foreignObject x="905" y="222" width="440" height="70">
    <p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;font-size:14px;color:#555;line-height:1.5;font-family:inherit;">
      yet a very limited success rate translating academic discoveries to industrial-scale materials.
    </p>
  </foreignObject>

  <circle cx="885" cy="330" r="6" fill="#4E2A84"/>
  <text x="905" y="320" fill="#333333" font-size="15" font-weight="600">Choosing valid descriptors</text>
  <foreignObject x="905" y="327" width="440" height="90">
    <p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;font-size:14px;color:#555;line-height:1.5;font-family:inherit;">
      rule-based models, graph neural networks, graph-based diffusion models, and score-based generative models each perform differently.
    </p>
  </foreignObject>

  <circle cx="885" cy="465" r="6" fill="#4E2A84"/>
  <text x="905" y="455" fill="#333333" font-size="15" font-weight="600">Scarce, fragmented data</text>
  <foreignObject x="905" y="462" width="440" height="90">
    <p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;font-size:14px;color:#555;line-height:1.5;font-family:inherit;">
      published results (mostly successes) and unpublished results (mostly failures) both matter &#8212; motivating a curated, LLM-assisted experimental data bank.
    </p>
  </foreignObject>

  <rect x="875" y="590" width="465" height="115" rx="10" fill="#ffffff" stroke="#c9bce6" stroke-width="1.5"/>
  <text x="1107" y="620" text-anchor="middle" fill="#4E2A84" font-size="14" font-weight="700">CORE IDEA</text>
  <foreignObject x="895" y="628" width="425" height="70">
    <p xmlns="http://www.w3.org/1999/xhtml" style="margin:0;font-size:13.5px;color:#333;line-height:1.5;text-align:center;font-style:italic;font-family:inherit;">
      &#8220;ML can accelerate discovery in chemistry, while chemistry makes AI models more principled and interpretable.&#8221;
    </p>
  </foreignObject>

  <!-- ============ APPLICATION DOMAINS ROW ============ -->
  <text x="700" y="770" text-anchor="middle" fill="#1a1a1a" font-size="22" font-weight="700">Application Domains</text>

  <!-- Badge 1: Sustainable Chemistry -->
  <g transform="translate(90,795)">
    <rect width="290" height="110" rx="20" fill="#2E8B57"/>
    <g transform="translate(30,25)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 30 C 0 10, 20 -5, 40 0 C 45 15, 35 30, 20 32 C 25 20, 22 10, 12 5"/>
    </g>
    <text x="150" y="45" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">SUSTAINABLE</text>
    <text x="150" y="66" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">CHEMISTRY</text>
  </g>

  <!-- Badge 2: Functional Materials -->
  <g transform="translate(400,795)">
    <rect width="290" height="110" rx="20" fill="#3B6FC4"/>
    <g transform="translate(30,15)" stroke="#ffffff" stroke-width="2.5" fill="none">
      <circle cx="10" cy="10" r="6" fill="#ffffff" stroke="none"/>
      <circle cx="35" cy="0" r="6" fill="#ffffff" stroke="none"/>
      <circle cx="35" cy="25" r="6" fill="#ffffff" stroke="none"/>
      <circle cx="10" cy="35" r="6" fill="#ffffff" stroke="none"/>
      <path d="M10 10 L35 0 M10 10 L35 25 M10 10 L10 35 M35 25 L10 35"/>
    </g>
    <text x="150" y="45" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">FUNCTIONAL</text>
    <text x="150" y="66" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">MATERIALS</text>
  </g>

  <!-- Badge 3: Synthetic Chemistry -->
  <g transform="translate(710,795)">
    <rect width="290" height="110" rx="20" fill="#E07A2C"/>
    <g transform="translate(35,10)" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linejoin="round">
      <path d="M12 0 L12 15 L2 35 C0 40, 3 44, 8 44 L28 44 C33 44, 36 40, 34 35 L24 15 L24 0" />
      <line x1="8" y1="0" x2="28" y2="0"/>
    </g>
    <text x="150" y="45" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">SYNTHETIC</text>
    <text x="150" y="66" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">CHEMISTRY</text>
  </g>

  <!-- Badge 4: Renewable Energy -->
  <g transform="translate(1020,795)">
    <rect width="290" height="110" rx="20" fill="#D9A404"/>
    <polygon points="22,0 4,26 16,26 10,46 32,18 19,18" fill="#ffffff" transform="translate(20,2)"/>
    <text x="150" y="45" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">RENEWABLE</text>
    <text x="150" y="66" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">ENERGY</text>
  </g>

  <!-- ============ ARROW MARKERS ============ -->
  <defs>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#5FA05F"/>
    </marker>
    <marker id="arrowPurple" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="9" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#8a6bc9"/>
    </marker>
    <marker id="arrowPurpleSmall" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8a6bc9"/>
    </marker>
  </defs>

</svg>
